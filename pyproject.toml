[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voynich-ductus"
version = "0.1.0"
description = "Objective Vector Glyph Extraction, Ductus Kinematics, and Statistical Paleography Pipeline for the Voynich Manuscript"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Voynich Ductus Contributors" }
]
keywords = [
    "voynich-manuscript",
    "paleography",
    "stroke-extraction",
    "ductus",
    "computational-linguistics",
    "digital-humanities",
    "computer-vision",
    "shannon-entropy",
    "kolmogorov-complexity"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "scikit-image>=0.19.0",
    "scikit-learn>=1.1.0",
    "networkx>=2.8.0",
    "Pillow>=9.0.0",
    "requests>=2.28.0",
    "matplotlib>=3.5.0",
    "click>=8.0.0",
    "tqdm>=4.64.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0"
]

[project.scripts]
voynich-ductus = "voynich_ductus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
